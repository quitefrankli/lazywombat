name: Update yt-dlp

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ytdlp-main
  cancel-in-progress: false

jobs:
  update-requirement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Configure private dependency access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: gh auth setup-git

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: uv sync --locked

      - name: Validate updater
        run: >-
          uv run --locked python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_update_ytdlp_requirement.py

      - name: Update requirement
        id: update
        run: |
          uv run --locked python -m scripts.update_ytdlp_requirement
          if git diff --quiet -- pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install updated application dependencies
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          uv lock --upgrade-package yt-dlp
          uv sync --locked

      - name: Install system test dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Validate updated dependency
        if: steps.update.outputs.changed == 'true'
        run: uv run --locked pytest -q -m "not ffmpeg"

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml uv.lock
          git commit -m "Update yt-dlp requirement"
          git push origin HEAD:main
