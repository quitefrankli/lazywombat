name: Update yt-dlp

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ytdlp-main
  cancel-in-progress: false

jobs:
  update-requirement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLASK_SECRET_KEY: github-actions-test-secret-key

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install updater test dependencies
        run: >-
          python -m pip install
          "packaging==24.2" "python-dotenv>=1.0.0" pytest

      - name: Validate updater
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_update_ytdlp_requirement.py

      - name: Update requirement
        id: update
        run: |
          python -m scripts.update_ytdlp_requirement
          if git diff --quiet -- requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install updated application dependencies
        if: steps.update.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Install system test dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Validate updated dependency
        if: steps.update.outputs.changed == 'true'
        run: pytest -q -m "not ffmpeg"

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements.txt
          git commit -m "Update yt-dlp requirement"
          git push origin HEAD:main
