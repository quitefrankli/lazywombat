name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Configure private dependency access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: gh auth setup-git

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: uv sync --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run tests
        run: uv run --locked pytest -q -m "not ffmpeg"

  deploy:
    needs: pytest
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag points to main
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Deploy release
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          python -c 'import json, os; print(json.dumps({
            "username": os.environ["ADMIN_USER"],
            "password": os.environ["ADMIN_PASS"],
          }))' |
            curl --fail --show-error --silent \
              --header "Content-Type: application/json" \
              --data-binary @- \
              https://nabicat.site/api/update
